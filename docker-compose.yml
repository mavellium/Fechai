# Stack de produção do fechai (servidor Linux) — único docker-compose do projeto.
#
# "web-blue", "web-green" e "worker" usam a MESMA imagem (um único Dockerfile).
# Os dois webs permitem publicar sem interromper a versão que está atendendo.
#
# "evolution" + "evolution-postgres" são o gateway de WhatsApp (Evolution API v2,
# self-hosted). Roda junto com a stack em produção; localmente use
# `docker-compose.evolution.yml` para subir só ele sem o resto.
#
# HTTPS via Traefik (proxy reverso externo, mesmo padrão do projeto janus):
# os slots web entram na rede externa `traefik-public` e expõem as rotas por labels —
# nada de porta mapeada no host para o app. O Traefik (rodando fora deste
# compose) publica 80/443 e emite o certificado via `myresolver` para
# `fechai.januscms.com.br`. Pré-requisito: a rede `traefik-public` já existe
# (`docker network create traefik-public`) e o DNS do domínio aponta pra VPS.
#
# Uso (deploy completo, servidor):
#   cp .env.example .env      # preencha os valores reais
#   docker compose up -d --wait postgres redis evolution-postgres evolution
#   ./deploy.sh all           # primeira subida e deploys blue/green
#
# Uso (dev local — só a infra, app roda via `next dev` fora do Docker):
#   npm run db:up             # == docker compose up -d postgres redis
#
# Detalhes e passo a passo completo em README.docker.md.

x-web-common: &web-common
  image: fechai-app:prod
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_BUNNY_PULL_ZONE: ${NEXT_PUBLIC_BUNNY_PULL_ZONE}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  command: ["npm", "run", "start"]
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-environment
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas}?schema=public
    REDIS_URL: redis://redis:6379
    EVOLUTION_API_URL: http://evolution:8080
    NODE_ENV: production
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - fechai_net
    - traefik-public
  healthcheck: &web-healthcheck
    test: ["CMD", "node", "docker/healthcheck-web.js"]
    interval: 5s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    ports:
      # Só em loopback: dá pra rodar `npm run dev` local (fora do Docker) e pra
      # inspecionar o banco no próprio servidor (psql/DBeaver via túnel SSH), mas
      # não fica alcançável de fora da máquina. Se a 5433 já estiver ocupada na
      # VPS (outro Postgres), defina POSTGRES_HOST_PORT no .env para uma livre.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fechai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - fechai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Só um deles fica ativo depois de cada deploy. Durante a troca os dois ficam
  # saudáveis por alguns segundos; o Traefik pode servir qualquer um sem buraco.
  web-blue:
    <<: *web-common
    profiles: ["blue"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.fechai-blue.rule=Host(`${APP_DOMAIN:-fechai.januscms.com.br}`)"
      - "traefik.http.routers.fechai-blue.entrypoints=websecure"
      - "traefik.http.routers.fechai-blue.tls.certresolver=myresolver"
      - "traefik.http.routers.fechai-blue.service=fechai-blue"
      - "traefik.http.services.fechai-blue.loadbalancer.server.port=3000"
      - "traefik.http.services.fechai-blue.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.fechai-blue.loadbalancer.healthcheck.interval=5s"

  web-green:
    <<: *web-common
    profiles: ["green"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.fechai-green.rule=Host(`${APP_DOMAIN:-fechai.januscms.com.br}`)"
      - "traefik.http.routers.fechai-green.entrypoints=websecure"
      - "traefik.http.routers.fechai-green.tls.certresolver=myresolver"
      - "traefik.http.routers.fechai-green.service=fechai-green"
      - "traefik.http.services.fechai-green.loadbalancer.server.port=3000"
      - "traefik.http.services.fechai-green.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.fechai-green.loadbalancer.healthcheck.interval=5s"

  worker:
    image: fechai-app:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BUNNY_PULL_ZONE: ${NEXT_PUBLIC_BUNNY_PULL_ZONE}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fechai_net
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck-worker.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Gateway de WhatsApp (Evolution API v2). O app (evolution.ts) fala com ele
  # via HTTP na porta EVOLUTION_PORT. Banco próprio isolado (evolution-postgres)
  # e cache Redis reutilizando o redis da stack.
  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
    volumes:
      - evolutionpgdata:/var/lib/postgresql/data
    networks:
      - fechai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      # URL pública da própria Evolution (aparece no painel dela). Sem valor
      # real, usa localhost.
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-postgres:5432/${EVOLUTION_DB_NAME:-evolution}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_CONNECTION_CLIENT_NAME: fechai_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/6"
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Webhook para o app receber mensagens reais. Em produção aponte para o
      # fechai (ex.: https://fechai.januscms.com.br/api/webhooks/whatsapp) e ligue.
      WEBHOOK_GLOBAL_ENABLED: ${EVOLUTION_WEBHOOK_ENABLED:-false}
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      LANGUAGE: pt-BR
    ports:
      # Só em loopback: a Evolution é alcançada pelo app pela rede interna
      # (http://evolution:8080). A porta aberta no host é pra admin/debug via
      # túnel SSH no próprio servidor — não fica exposta pra internet.
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fechai_net

networks:
  fechai_net:
    driver: bridge
  # Rede externa do Traefik (proxy reverso + HTTPS). Precisa já existir no host:
  #   docker network create traefik-public
  # O container do Traefik e o slot web ativo entram nela; o Traefik roteia
  # o domínio ao container saudável pelas labels acima.
  traefik-public:
    external: true

volumes:
  pgdata:
  redisdata:
  evolutionpgdata:
